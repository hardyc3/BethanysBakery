  /admin/v1/audit-events:
    get:
      tags: [Admin System]
      operationId: listAuditEvents
      summary: Audit events for an entity or recent activity
      security: [{ adminBearer: [], deviceApiKey: [] }]
      parameters:
        - { name: entityType, in: query, schema: { type: string } }
        - { name: entityId, in: query, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AuditEvent' }

components:
  securitySchemes:
    customerCookie:
      type: apiKey
      in: cookie
      name: bb_access
    adminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    deviceApiKey:
      type: apiKey
      in: header
      name: X-Device-Key

  parameters:
    MenuId:
      name: menuId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MenuDateId:
      name: menuDateId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OfferingId:
      name: offeringId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MediaId:
      name: mediaId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  responses:
    NoContent:
      description: No content
    Accepted:
      description: Accepted
    BadRequest:
      description: Invalid request
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Authentication required or failed
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Not allowed
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Not found
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: State conflict, sold out, cutoff passed, or capacity full
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: Rate limited
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code:
          type: string
          examples:
            - VALIDATION_ERROR
            - SOLD_OUT
            - WINDOW_FULL
            - CUTOFF_PASSED
            - CANCELLATION_CLOSED
            - RATE_LIMITED
        requestId: { type: string }
        errors:
          type: array
          items: { $ref: '#/components/schemas/FieldError' }
    FieldError:
      type: object
      required: [field, message]
      properties:
        field: { type: string }
        message: { type: string }

    PublicConfig:
      type: object
      required: [bakeryName, timezone, pickupAddress, mapsUrl, supportEmail]
      properties:
        bakeryName: { type: string }
        timezone: { type: string, example: America/Denver }
        pickupAddress: { type: string }
        mapsUrl: { type: string, format: uri }
        supportEmail: { type: string, format: email }
        orderCutoffHours: { type: integer, example: 12 }

    CsrfToken:
      type: object
      required: [token]
      properties:
        token: { type: string }

    OtpRequest:
      type: object
      required: [channel, destination]
      properties:
        channel: { $ref: '#/components/schemas/OtpChannel' }
        destination: { type: string }
    OtpRequestResult:
      type: object
      required: [challengeId, channel, destinationMasked, expiresAt, resendAfterSeconds]
      properties:
        challengeId: { type: string, format: uuid }
        channel: { $ref: '#/components/schemas/OtpChannel' }
        destinationMasked: { type: string, example: b***@cherry-home.com }
        expiresAt: { type: string, format: date-time }
        resendAfterSeconds: { type: integer }
    OtpVerifyRequest:
      type: object
      required: [challengeId, code]
      properties:
        challengeId: { type: string, format: uuid }
        code: { type: string, pattern: '^[0-9]{6}$' }
    OtpChannel:
      type: string
      enum: [EMAIL, SMS]

    Customer:
      type: object
      required: [id, name, emailVerified, phoneVerified, smsConsent, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: [string, 'null'] }
        email: { type: [string, 'null'], format: email }
        phone: { type: [string, 'null'] }
        emailVerified: { type: boolean }
        phoneVerified: { type: boolean }
        smsConsent: { type: boolean }
        createdAt: { type: string, format: date-time }
    CustomerSession:
      type: object
      required: [customer]
      properties:
        customer: { $ref: '#/components/schemas/Customer' }
    CustomerProfileUpdate:
      type: object
      minProperties: 1
      properties:
        name: { type: string, maxLength: 120 }
    ContactVerificationRequest:
      type: object
      required: [channel, destination]
      properties:
        channel: { $ref: '#/components/schemas/OtpChannel' }
        destination: { type: string }

    NotificationPreferences:
      type: object
      required: [smsConsent, smsOptedOut, preferences]
      properties:
        smsConsent: { type: boolean }
        smsOptedOut: { type: boolean, description: True after a STOP-family webhook until the customer explicitly re-consents. }
        preferences:
          type: array
          items: { $ref: '#/components/schemas/NotificationPreference' }
    NotificationPreference:
      type: object
      required: [eventType, emailEnabled, smsEnabled]
      properties:
        eventType: { $ref: '#/components/schemas/NotificationEventType' }
        emailEnabled: { type: boolean }
        smsEnabled: { type: boolean }
    NotificationPreferencesWrite:
      type: object
      required: [smsConsent, preferences]
      properties:
        smsConsent: { type: boolean }
        preferences:
          type: array
          items: { $ref: '#/components/schemas/NotificationPreference' }
    NotificationEventType:
      type: string
      enum:
        - MENU_PUBLISHED
        - ORDER_REMINDER
        - ORDER_ACCEPTED
        - ORDER_READY
        - ORDER_DELAYED
        - ORDER_REJECTED
        - ORDER_CANCELLED
        - ORDER_EXPIRED
        - MENU_CANCELLED

    PublicMenuDateSummary:
      type: object
      required: [id, bakeDate, status, windowCount, offeringCount, orderCutoffAt]
      properties:
        id: { type: string, format: uuid }
        bakeDate: { type: string, format: date }
        status: { type: string, enum: [PUBLISHED] }
        windowCount: { type: integer }
        offeringCount: { type: integer }
        orderCutoffAt: { type: string, format: date-time }
    PublicMenuDate:
      type: object
      required: [id, bakeDate, status, pickupWindows, offerings]
      properties:
        id: { type: string, format: uuid }
        menuId: { type: string, format: uuid }
        title: { type: string }
        notes: { type: [string, 'null'] }
        bakeDate: { type: string, format: date }
        status: { type: string, enum: [PUBLISHED] }
        pickupWindows:
          type: array
          items: { $ref: '#/components/schemas/PublicPickupWindow' }
        offerings:
          type: array
          items: { $ref: '#/components/schemas/PublicOffering' }
    PublicPickupWindow:
      type: object
      required: [id, label, startAt, endAt, availableCapacity]
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        availableCapacity: { type: integer }
        orderCutoffAt: { type: string, format: date-time }
    PublicOffering:
      type: object
      required: [id, name, priceCents, availableQuantity, soldOut, windowIds, customizationGroups]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, 'null'] }
        photoUrl: { type: [string, 'null'], format: uri }
        photoVariants:
          type: [object, 'null']
          description: Map of requested pixel size to absolute URL. Keys are 400, 800, 1600.
          additionalProperties: { type: string, format: uri }
        priceCents: { type: integer, minimum: 0 }
        availableQuantity: { type: integer, minimum: 0 }
        soldOut: { type: boolean }
        ingredientsText: { type: [string, 'null'] }
        allergenTags:
          type: array
          items: { type: string }
        windowIds:
          type: array
          items: { type: string, format: uuid }
        customizationGroups:
          type: array
          items: { $ref: '#/components/schemas/PublicCustomizationGroup' }
    PublicCustomizationGroup:
      type: object
      required: [id, name, selectionType, required, minSelections, maxSelections, options]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        selectionType: { type: string, enum: [SINGLE, MULTI] }
        required: { type: boolean }
        minSelections: { type: integer }
        maxSelections: { type: integer }
        options:
          type: array
          items: { $ref: '#/components/schemas/PublicCustomizationOption' }
    PublicCustomizationOption:
      type: object
      required: [id, name, priceDeltaCents, available]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        priceDeltaCents: { type: integer }
        available: { type: boolean }

    CreateOrderRequest:
      type: object
      required: [menuDateId, pickupWindowId, items]
      properties:
        menuDateId: { type: string, format: uuid }
        pickupWindowId: { type: string, format: uuid }
        idempotency_key:
          type: [string, 'null']
          maxLength: 128
          description: Client-generated key for safe retries. Reusing a key returns the existing order for the same customer.
        items:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: '#/components/schemas/CreateOrderItem' }
        notes: { type: [string, 'null'], maxLength: 500 }
    CreateOrderItem:
      type: object
      required: [offeringId, quantity]
      properties:
        offeringId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, maximum: 99 }
        optionIds:
          type: array
          items: { type: string, format: uuid }
        notes: { type: [string, 'null'], maxLength: 300 }
    CancelOrderRequest:
      type: object
      properties:
        reason: { type: [string, 'null'], maxLength: 500 }
    AdminCancelOrderRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
    RejectOrderRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
    DelayOrderRequest:
      type: object
      properties:
        reason: { type: [string, 'null'], maxLength: 500 }
    PaymentUpdateRequest:
      type: object
      required: [paid]
      properties:
        paid: { type: boolean }
        method: { type: [string, 'null'], enum: [VENMO, CASH, OTHER, null] }

    Order:
      type: object
      required:
        - id
        - orderNumber
        - status
        - paymentStatus
        - menuDateId
        - bakeDate
        - pickupWindow
        - customer
        - lines
        - subtotalCents
        - totalCents
        - expiresAt
        - createdAt
      properties:
        id: { type: string, format: uuid }
        orderNumber: { type: string, example: BB-20261120-0001 }
        status: { $ref: '#/components/schemas/OrderStatus' }
        paymentStatus: { $ref: '#/components/schemas/PaymentStatus' }
        paymentMethod: { type: [string, 'null'], enum: [VENMO, CASH, OTHER, null] }
        menuDateId: { type: string, format: uuid }
        bakeDate: { type: string, format: date }
