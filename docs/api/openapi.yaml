      security: [{ adminBearer: [], deviceApiKey: [] }]
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/NotificationStatus' } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationList' }

  /admin/v1/notifications/{notificationId}/retry:
    post:
      tags: [Admin Notifications]
      operationId: retryNotification
