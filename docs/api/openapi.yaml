openapi: 3.1.0
info:
  title: Bethany's Bakery API
  version: 0.1.0
  description: |
    Contract for the Bethany's Bakery customer and admin APIs.

    Security notes:
    - Customer web uses HttpOnly access/refresh cookies plus `X-CSRF-Token`.
    - Admin app uses bearer tokens, a device API key (`X-Device-Key`), and a
      Cloudflare-validated mTLS client certificate.
    - Admin device pairing happens on a separate non-mTLS hostname.
    - All instants are ISO-8601 UTC. Bake dates are `YYYY-MM-DD` in America/Denver.
    - Money is integer USD cents.
    - Errors use RFC 9457 Problem Details with a stable `code`.
servers:
  - url: https://bakery.cherry-home.com
    description: Customer web and public/customer API
  - url: https://bakery-admin-api.cherry-home.com
    description: Admin API (mTLS + device key)
  - url: http://localhost:8080
    description: Local development
tags:
  - name: Public
  - name: Customer Auth
  - name: Customer
  - name: Webhooks
  - name: Admin Auth
  - name: Admin Devices
  - name: Admin Catalog
  - name: Admin Menus
  - name: Admin Orders
  - name: Admin Notifications
  - name: Admin System

paths:
  /api/v1/config:
    get:
      tags: [Public]
      operationId: getPublicConfig
      summary: Public bakery configuration
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicConfig' }

  /api/v1/menu-dates:
    get:
      tags: [Public]
      operationId: listPublicMenuDates
      summary: List published upcoming bake dates
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PublicMenuDateSummary' }

  /api/v1/menu-dates/{menuDateId}:
    get:
      tags: [Public]
      operationId: getPublicMenuDate
      summary: Published bake date with windows and offerings
      parameters:
        - { $ref: '#/components/parameters/MenuDateId' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicMenuDate' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/offerings/{offeringId}:
    get:
      tags: [Public]
      operationId: getPublicOffering
      summary: Offering detail with ingredients, allergens, and customizations
      parameters:
        - { $ref: '#/components/parameters/OfferingId' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicOffering' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/media/{mediaId}:
    get:
      tags: [Public]
      operationId: getMedia
      summary: Public image asset
      parameters:
        - { $ref: '#/components/parameters/MediaId' }
        - { name: size, in: query, schema: { type: integer, enum: [400, 800, 1600] } }
      responses:
        '200':
          description: Image bytes
          content:
            image/webp:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/auth/csrf:
    get:
      tags: [Customer Auth]
      operationId: getCsrfToken
      summary: Issue CSRF cookie and return the token
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CsrfToken' }

  /api/v1/auth/otp/request:
    post:
      tags: [Customer Auth]
      operationId: requestCustomerOtp
      summary: Send a login code by email or SMS
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpRequest' }
      responses:
        '202':
          description: Code sent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OtpRequestResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/auth/otp/verify:
    post:
      tags: [Customer Auth]
      operationId: verifyCustomerOtp
      summary: Verify a login code and start a session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpVerifyRequest' }
      responses:
        '200':
          description: Authenticated. Sets HttpOnly cookies.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/auth/refresh:
    post:
      tags: [Customer Auth]
      operationId: refreshCustomerSession
      summary: Rotate the customer refresh token
      responses:
        '200':
          description: Rotated. Sets new cookies.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/auth/logout:
    post:
      tags: [Customer Auth]
      operationId: logoutCustomer
      summary: Revoke the current customer session
      security: [{ customerCookie: [] }]
      responses:
        '204': { $ref: '#/components/responses/NoContent' }

  /api/v1/me:
    get:
      tags: [Customer]
      operationId: getCustomerProfile
      summary: Current customer profile
      security: [{ customerCookie: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Customer]
      operationId: updateCustomerProfile
      summary: Update name, email, or phone
      security: [{ customerCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerProfileUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/me/contact-verification/request:
    post:
      tags: [Customer]
      operationId: requestContactVerification
      summary: Send a code to verify a new email or phone
      security: [{ customerCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContactVerificationRequest' }
      responses:
        '202':
          description: Code sent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OtpRequestResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/me/contact-verification/confirm:
    post:
      tags: [Customer]
      operationId: confirmContactVerification
      summary: Confirm a new email or phone
      security: [{ customerCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpVerifyRequest' }
      responses:
        '200':
          description: Verified
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/me/notification-preferences:
    get:
      tags: [Customer]
      operationId: getNotificationPreferences
      summary: Customer notification preferences
      security: [{ customerCookie: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPreferences' }
    put:
      tags: [Customer]
      operationId: updateNotificationPreferences
      summary: Update notification preferences and SMS consent
      security: [{ customerCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationPreferencesWrite' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPreferences' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/me/orders:
    get:
      tags: [Customer]
      operationId: listCustomerOrders
      summary: Current customer's orders
      security: [{ customerCookie: [] }]
      parameters:
        - { name: filter, in: query, schema: { $ref: '#/components/schemas/OrderFilter' } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderList' }

  /api/v1/orders:
    post:
      tags: [Customer]
      operationId: createOrder
      summary: Create an order for one pickup window
      security: [{ customerCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrderRequest' }
      responses:
        '200':
          description: Existing order returned for duplicate idempotency_key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/orders/{orderId}:
    get:
      tags: [Customer]
      operationId: getCustomerOrder
      summary: Customer order detail and payment instructions
      security: [{ customerCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/orders/{orderId}/cancel:
    post:
      tags: [Customer]
      operationId: cancelCustomerOrder
      summary: Cancel an order before the bake day starts
      security: [{ customerCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelOrderRequest' }
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/webhooks/textbee:
    post:
      tags: [Webhooks]
      operationId: receiveTextbeeWebhook
      summary: Textbee delivery and STOP/START events
      parameters:
        - { name: X-Textbee-Signature, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TextbeeWebhook' }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /admin/v1/devices/pair:
    post:
      tags: [Admin Devices]
      operationId: pairAdminDevice
      summary: Pair a new Android device using a one-time code
      description: |
        Served on the non-mTLS pairing hostname only. The server verifies the
        one-time code, signs the CSR with the device CA, stores the API key hash,
        and returns the client certificate and API key once.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PairDeviceRequest' }
      responses:
        '201':
          description: Paired
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PairDeviceResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /admin/v1/auth/login:
    post:
      tags: [Admin Auth]
      operationId: loginAdmin
      summary: Admin login with password, TOTP, device key, and mTLS
      security: [{ deviceApiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminLoginRequest' }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /admin/v1/auth/refresh:
    post:
      tags: [Admin Auth]
      operationId: refreshAdminSession
      summary: Rotate the admin refresh token
      security: [{ deviceApiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: Rotated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /admin/v1/auth/logout:
    post:
      tags: [Admin Auth]
      operationId: logoutAdmin
      summary: Revoke the current admin session
      security: [{ adminBearer: [], deviceApiKey: [] }]
      responses:
        '204': { $ref: '#/components/responses/NoContent' }

  /admin/v1/me:
    get:
      tags: [Admin Auth]
      operationId: getAdminProfile
      summary: Current admin profile
      security: [{ adminBearer: [], deviceApiKey: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminProfile' }

  /admin/v1/app-info:
    get:
      tags: [Admin System]
      operationId: getAdminAppInfo
      summary: Admin app version and update info
      description: Available to any paired device before login so the update gate can run.
      security: [{ deviceApiKey: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAppInfo' }

  /admin/v1/devices:
    get:
      tags: [Admin Devices]
      operationId: listAdminDevices
      summary: List paired devices
      security: [{ adminBearer: [], deviceApiKey: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdminDevice' }

  /admin/v1/devices/{deviceId}:
    delete:
      tags: [Admin Devices]
      operationId: revokeAdminDevice
      summary: Revoke a device
      security: [{ adminBearer: [], deviceApiKey: [] }]
      parameters:
        - { name: deviceId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }

  /admin/v1/devices/{deviceId}/push-token:
    put:
      tags: [Admin Devices]
      operationId: updateAdminPushToken
      summary: Register or clear the device FCM token
      security: [{ adminBearer: [], deviceApiKey: [] }]
      parameters:
        - { name: deviceId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PushTokenRequest' }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }

  /admin/v1/summary:
    get:
      tags: [Admin System]
      operationId: getAdminSummary
      summary: Counts for a bake date
      security: [{ adminBearer: [], deviceApiKey: [] }]
      parameters:
        - { name: date, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSummary' }

  /admin/v1/item-templates:
    get:
      tags: [Admin Catalog]
      operationId: listItemTemplates
      summary: List item templates
      security: [{ adminBearer: [], deviceApiKey: [] }]
      parameters:
        - { name: active, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ItemTemplate' }
    post:
      tags: [Admin Catalog]
      operationId: createItemTemplate
      summary: Create an item template
      security: [{ adminBearer: [], deviceApiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ItemTemplateWrite' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemTemplate' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /admin/v1/item-templates/{templateId}:
    get:
      tags: [Admin Catalog]
      operationId: getItemTemplate
      summary: Item template detail
      security: [{ adminBearer: [], deviceApiKey: [] }]
      parameters:
        - { name: templateId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemTemplate' }
    put:
      tags: [Admin Catalog]
      operationId: replaceItemTemplate
      summary: Replace an item template, including customization groups
      security: [{ adminBearer: [], deviceApiKey: [] }]
      parameters:
        - { name: templateId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ItemTemplateWrite' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemTemplate' }
    delete:
      tags: [Admin Catalog]
      operationId: deactivateItemTemplate
      summary: Deactivate an item template
      security: [{ adminBearer: [], deviceApiKey: [] }]
      parameters:
        - { name: templateId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }

  /admin/v1/media:
    post:
      tags: [Admin Catalog]
      operationId: uploadMedia
      summary: Upload and normalize an image
      security: [{ adminBearer: [], deviceApiKey: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: Uploaded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Media' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '413':
          description: File too large
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /admin/v1/media/{mediaId}:
    delete:
      tags: [Admin Catalog]
      operationId: deleteMedia
      summary: Delete unused media
      security: [{ adminBearer: [], deviceApiKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/MediaId' }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/v1/menus:
    get:
      tags: [Admin Menus]
      operationId: listMenus
      summary: List menus
      security: [{ adminBearer: [], deviceApiKey: [] }]
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/MenuStatus' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MenuSummary' }
    post:
      tags: [Admin Menus]
      operationId: createMenu
      summary: Create a draft menu
      security: [{ adminBearer: [], deviceApiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MenuWrite' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Menu' }

  /admin/v1/menus/{menuId}:
    get:
      tags: [Admin Menus]
      operationId: getMenu
      summary: Menu with dates, windows, and offerings
      security: [{ adminBearer: [], deviceApiKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/MenuId' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Menu' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Admin Menus]
      operationId: updateMenu
      summary: Update draft menu fields
      security: [{ adminBearer: [], deviceApiKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/MenuId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MenuWrite' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Menu' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Admin Menus]
      operationId: deleteDraftMenu
      summary: Delete a draft menu
      security: [{ adminBearer: [], deviceApiKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/MenuId' }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/v1/menus/{menuId}/publish:
    post:
      tags: [Admin Menus]
      operationId: publishMenu
      summary: Publish a menu and schedule the new-menu notification
      security: [{ adminBearer: [], deviceApiKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/MenuId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublishMenuRequest' }
      responses:
        '200':
          description: Published
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Menu' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/v1/menus/{menuId}/cancel:
    post:
      tags: [Admin Menus]
      operationId: cancelMenu
      summary: Cancel a menu and its active orders
      security: [{ adminBearer: [], deviceApiKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/MenuId' }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelMenuRequest' }
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Menu' }

  /admin/v1/menus/{menuId}/dates:
    post:
      tags: [Admin Menus]
      operationId: addMenuDate
      summary: Add a bake date to a draft menu
      security: [{ adminBearer: [], deviceApiKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/MenuId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MenuDateWrite' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MenuDate' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/v1/menu-dates/{menuDateId}:
    get:
      tags: [Admin Menus]
      operationId: getMenuDate
      summary: Bake date with windows and offerings
      security: [{ adminBearer: [], deviceApiKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/MenuDateId' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MenuDate' }
    put:
      tags: [Admin Menus]
      operationId: updateMenuDate
      summary: Update a draft bake date
      security: [{ adminBearer: [], deviceApiKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/MenuDateId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MenuDateWrite' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MenuDate' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Admin Menus]
