        '200':
          description: Cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/v1/orders/{orderId}/payment:
    put:
      tags: [Admin Orders]
      operationId: updateOrderPayment
      summary: Mark an order paid or unpaid
      security: [{ adminBearer: [], deviceApiKey: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentUpdateRequest' }
