spring:
  jpa:
    show-sql: false
bakery:
  name: Test Bakery
  timezone: America/Denver
  pickup-address: 123 Test St, Lehi, UT
  maps-url: https://maps.google.com/?q=123+Test+St
  support-email: test@example.com
  order-cutoff-hours: 12
  media:
    root: ./build/test-media
    max-upload-bytes: 10485760
    max-edge-pixels: 1600
    max-decode-pixels: 40000000
    max-source-edge: 10000
  auth:
    jwt-secret: dGVzdC1qd3Qtc2VjcmV0LXRlc3Qtand0LXNlY3JldC10ZXN0
    app-encryption-key: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    admin-mtls-header: Cf-Authenticated-Client-Cert
    admin-mtls-local-bypass: true
    admin-access-ttl: PT15M
    admin-refresh-ttl: P14D
    customer-access-ttl: PT15M
    customer-refresh-ttl: P30D
    otp-ttl: PT10M
    otp-max-attempts: 5
    otp-resend-seconds: 60
    otp-max-sends-per-15m: 3
    admin-max-failed-logins: 5
    admin-lockout: PT15M
    app-public-base-url: https://public.example.com
  notifications:
    scheduling-enabled: false
    admin-alert-email: admin@example.com
    textbee:
      webhook-secret: test-webhook-secret
