spring:
  application:
    name: bethanys-bakery-api
  jackson:
    time-zone: UTC
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bethanysbakery}
    username: ${DB_USER:bakery}
    password: ${DB_PASSWORD:bakery}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:1}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: ${MEDIA_MAX_UPLOAD_BYTES:10485760}
      max-request-size: ${MEDIA_MAX_REQUEST_BYTES:11534336}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

bakery:
  name: ${BAKERY_NAME:Bethany's Bakery}
  timezone: ${BAKERY_TIMEZONE:America/Denver}
  pickup-address: ${BAKERY_PICKUP_ADDRESS:Lehi, Utah}
  maps-url: ${BAKERY_MAPS_URL:https://maps.google.com/?q=Lehi,Utah}
  support-email: ${BAKERY_SUPPORT_EMAIL:support@example.com}
  order-cutoff-hours: ${ORDER_CUTOFF_HOURS:12}
  media:
    root: ${MEDIA_ROOT:/data/media}
    max-upload-bytes: ${MEDIA_MAX_UPLOAD_BYTES:10485760}
    max-edge-pixels: ${MEDIA_MAX_EDGE_PIXELS:1600}
    max-decode-pixels: ${MEDIA_MAX_DECODE_PIXELS:40000000}
    max-source-edge: ${MEDIA_MAX_SOURCE_EDGE:10000}
  auth:
    jwt-secret: ${JWT_SECRET:}
    app-encryption-key: ${APP_ENCRYPTION_KEY:}
    admin-device-ca-cert-path: ${ADMIN_DEVICE_CA_CERT_PATH:}
    admin-device-ca-key-path: ${ADMIN_DEVICE_CA_KEY_PATH:}
    admin-mtls-header: ${ADMIN_MTLS_HEADER:Cf-Authenticated-Client-Cert}
    admin-mtls-verified-header: ${ADMIN_MTLS_VERIFIED_HEADER:Cf-Authenticated-Client-Cert-Verified}
    admin-mtls-local-bypass: ${ADMIN_MTLS_LOCAL_BYPASS:false}
    admin-access-ttl: ${ADMIN_ACCESS_TTL:PT15M}
    admin-refresh-ttl: ${ADMIN_REFRESH_TTL:P14D}
    customer-access-ttl: ${CUSTOMER_ACCESS_TTL:PT15M}
    customer-refresh-ttl: ${CUSTOMER_REFRESH_TTL:P30D}
    otp-ttl: ${OTP_TTL:PT10M}
    otp-max-attempts: ${OTP_MAX_ATTEMPTS:5}
    otp-resend-seconds: ${OTP_RESEND_SECONDS:60}
    otp-max-sends-per-15m: ${OTP_MAX_SENDS_PER_15M:3}
    admin-max-failed-logins: ${ADMIN_MAX_FAILED_LOGINS:5}
    admin-lockout: ${ADMIN_LOCKOUT:PT15M}
    app-public-base-url: ${APP_PUBLIC_BASE_URL:}
    app-admin-api-url: ${APP_ADMIN_API_URL:}
    app-pair-url: ${APP_PAIR_URL:}
  admin-app:
    latest-version: ${ADMIN_APP_LATEST_VERSION:1.0.0}
    min-version: ${ADMIN_APP_MIN_VERSION:1.0.0}
    download-url: ${ADMIN_APP_DOWNLOAD_URL:https://example.com/admin-app.apk}
    release-notes: ${ADMIN_APP_RELEASE_NOTES:}
