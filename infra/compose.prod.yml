# Production stack on one Proxmox LXC. cloudflared reaches services over internal
# Docker networks and exposes one public hostname via Tunnel with path-based
# ingress (/admin/v1, /api, /). The only host port is the metrics surface on
# 9090; owner firewall restricts it to PROMETHEUS_SCRAPE_CIDR.
name: bethanys-bakery-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  # Placeholder until W8 ships web/Dockerfile + web/nginx.conf. Replacing the
  # WEB_IMAGE tag is the only S7 change needed; no competing nginx config here.
  web:
    image: ${WEB_IMAGE:-httpd:2.4-alpine}
    user: "10001:10001"
    cap_add:
      - NET_BIND_SERVICE
    networks:
      - edge
    depends_on:
      - api
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
      - /usr/local/apache2/logs:rw,nosuid,size=16m,mode=1777
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:80/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128m

  api:
    build:
      context: ../server
      dockerfile: Dockerfile
    image: ${API_IMAGE:-bethanys-bakery-api:prod}
    # Explicit allowlist: do not pass the tunnel token to the API.
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-bethanysbakery}
      DB_USER: ${DB_USER:-bakery}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      DB_POOL_MIN: ${DB_POOL_MIN:-1}
      BAKERY_NAME: ${BAKERY_NAME:-Bethany's Bakery}
      BAKERY_TIMEZONE: ${BAKERY_TIMEZONE:-America/Denver}
      BAKERY_PICKUP_ADDRESS: ${BAKERY_PICKUP_ADDRESS:-Lehi, Utah}
      BAKERY_MAPS_URL: ${BAKERY_MAPS_URL:-https://maps.google.com/?q=Lehi,Utah}
      BAKERY_SUPPORT_EMAIL: ${BAKERY_SUPPORT_EMAIL:-support@example.com}
      ORDER_CUTOFF_HOURS: ${ORDER_CUTOFF_HOURS:-12}
      MEDIA_ROOT: /data/media
      MEDIA_MAX_UPLOAD_BYTES: ${MEDIA_MAX_UPLOAD_BYTES:-10485760}
      MEDIA_MAX_REQUEST_BYTES: ${MEDIA_MAX_REQUEST_BYTES:-11534336}
      MEDIA_MAX_EDGE_PIXELS: ${MEDIA_MAX_EDGE_PIXELS:-1600}
      MEDIA_MAX_DECODE_PIXELS: ${MEDIA_MAX_DECODE_PIXELS:-40000000}
      MEDIA_MAX_SOURCE_EDGE: ${MEDIA_MAX_SOURCE_EDGE:-10000}
      CLOUDFLARE_PROXY: ${CLOUDFLARE_PROXY:-false}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?APP_ENCRYPTION_KEY is required}
      ADMIN_DEVICE_CA_CERT_PATH: /run/secrets/device-ca.crt
      ADMIN_DEVICE_CA_KEY_PATH: /run/secrets/device-ca.key
      ADMIN_MTLS_HEADER: ${ADMIN_MTLS_HEADER:-Cf-Authenticated-Client-Cert}
      ADMIN_MTLS_VERIFIED_HEADER: ${ADMIN_MTLS_VERIFIED_HEADER:-Cf-Authenticated-Client-Cert-Verified}
      ADMIN_MTLS_LOCAL_BYPASS: ${ADMIN_MTLS_LOCAL_BYPASS:-false}
      METRICS_PORT: ${METRICS_PORT:-9090}
      METRICS_BIND_ADDRESS: 0.0.0.0
      ADMIN_ACCESS_TTL: ${ADMIN_ACCESS_TTL:-PT15M}
      ADMIN_REFRESH_TTL: ${ADMIN_REFRESH_TTL:-P14D}
      CUSTOMER_ACCESS_TTL: ${CUSTOMER_ACCESS_TTL:-PT15M}
      CUSTOMER_REFRESH_TTL: ${CUSTOMER_REFRESH_TTL:-P30D}
      OTP_TTL: ${OTP_TTL:-PT10M}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-5}
      OTP_RESEND_SECONDS: ${OTP_RESEND_SECONDS:-60}
      OTP_MAX_SENDS_PER_15M: ${OTP_MAX_SENDS_PER_15M:-3}
      ADMIN_MAX_FAILED_LOGINS: ${ADMIN_MAX_FAILED_LOGINS:-5}
      ADMIN_LOCKOUT: ${ADMIN_LOCKOUT:-PT15M}
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:-https://bakery.cherry-home.com}
      APP_ADMIN_API_URL: ${APP_ADMIN_API_URL:-https://bakery.cherry-home.com/admin/v1}
      APP_PAIR_URL: ${APP_PAIR_URL:-https://bakery.cherry-home.com/admin/v1/devices/pair}
      ADMIN_APP_LATEST_VERSION: ${ADMIN_APP_LATEST_VERSION:-1.0.0}
      ADMIN_APP_MIN_VERSION: ${ADMIN_APP_MIN_VERSION:-1.0.0}
      ADMIN_APP_DOWNLOAD_URL: ${ADMIN_APP_DOWNLOAD_URL:-https://downloads.cherry-home.com/bethanys-bakery-admin.apk}
      ADMIN_APP_RELEASE_NOTES: ${ADMIN_APP_RELEASE_NOTES:-}
      VENMO_HANDLE: ${VENMO_HANDLE:-bethanysbakery}
      VENMO_DISPLAY_NAME: ${VENMO_DISPLAY_NAME:-Bethany's Bakery}
      ADMIN_ALERT_EMAIL: ${ADMIN_ALERT_EMAIL:-}
      ADMIN_ALERT_PHONE: ${ADMIN_ALERT_PHONE:-}
      BAKERY_OTP_SENDER: ${OTP_SENDER:-}
      SPRINGDOC_API_DOCS_ENABLED: ${SPRINGDOC_API_DOCS_ENABLED:-false}
      SPRINGDOC_SWAGGER_UI_ENABLED: ${SPRINGDOC_SWAGGER_UI_ENABLED:-false}
      NOTIFICATION_SCHEDULING_ENABLED: ${NOTIFICATION_SCHEDULING_ENABLED:-true}
      NOTIFICATION_OUTBOX_INTERVAL_MS: ${NOTIFICATION_OUTBOX_INTERVAL_MS:-15000}
      NOTIFICATION_DISPATCH_INTERVAL_MS: ${NOTIFICATION_DISPATCH_INTERVAL_MS:-30000}
      NOTIFICATION_MENU_INTERVAL_MS: ${NOTIFICATION_MENU_INTERVAL_MS:-60000}
      ORDER_EXPIRY_INTERVAL_MS: ${ORDER_EXPIRY_INTERVAL_MS:-60000}
      MAILGUN_API_KEY: ${MAILGUN_API_KEY:-}
      MAILGUN_DOMAIN: ${MAILGUN_DOMAIN:-}
      MAILGUN_API_BASE: ${MAILGUN_API_BASE:-https://api.mailgun.net/v3}
      MAILGUN_FROM: ${MAILGUN_FROM:-}
      TEXTBEE_BASE_URL: ${TEXTBEE_BASE_URL:-}
      TEXTBEE_API_KEY: ${TEXTBEE_API_KEY:-}
      TEXTBEE_DEVICE_ID: ${TEXTBEE_DEVICE_ID:-}
      TEXTBEE_WEBHOOK_SECRET: ${TEXTBEE_WEBHOOK_SECRET:-}
    ports:
      - "0.0.0.0:9090:9090"
    volumes:
      - media-data:/data/media
      - ${SECRETS_DIR:-/opt/bethanys-bakery/secrets}:/run/secrets:ro
    networks:
      - edge
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
      - /var/run:rw,nosuid,size=16m,mode=1777
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9090/actuator/health/readiness >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1g

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_DB: ${DB_NAME:-bethanysbakery}
      POSTGRES_USER: ${DB_USER:-bakery}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=16m,mode=1777
      - /var/run/postgresql:rw,nosuid,size=16m,mode=1777
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-bakery} -d ${DB_NAME:-bethanysbakery}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1g

  cloudflared:
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:latest}
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN is required}
    user: "65532:65532"
    networks:
      - edge
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    healthcheck:
      test: ["CMD", "cloudflared", "--version"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128m

networks:
  edge:
    name: bethanys-bakery-prod-edge
    driver: bridge
  backend:
    name: bethanys-bakery-prod-backend
    driver: bridge

volumes:
  postgres-data:
    name: bethanys-bakery-prod-postgres-data
  media-data:
    name: bethanys-bakery-prod-media-data
