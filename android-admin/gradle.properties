org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=false
android.useAndroidX=true
kotlin.code.style=official

# Exact production endpoints. The QR/manual payloads must match these values.
APP_PAIR_URL=https://bakery.cherry-home.com/admin/v1/devices/pair
APP_ADMIN_API_URL=https://bakery.cherry-home.com/admin/v1

# Comma-separated SPKI SHA-256 pins. A8 supplies final values; release needs >= 2.
# Override via -PADMIN_API_PINS=... or the ADMIN_API_PINS environment variable.
ADMIN_API_PINS=

# Debug-only list (comma-separated hosts). 10.0.2.2 is always allowed for http in debug.
DEBUG_LAN_HOSTS=

# Debug pinning is off by default; set -PADMIN_API_PINNING_DEBUG=true to verify pins locally.
ADMIN_API_PINNING_DEBUG=false

# Debug-only PEM CA for local mTLS testing. Never set for release.
ADMIN_TEST_CA_PEM=
